<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Woodworking Projects</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, sans-serif;
  background: #111;
  color: #ddd;
  padding: 2rem 1.5rem;
  max-width: 1200px;
  margin: 0 auto;
}
a { color: #c8a96e; text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.6rem; margin-bottom: 0.25rem; color: #fff; }
h2 { font-size: 1.3rem; color: #c8a96e; margin-bottom: 1rem; }
.meta { font-size: 0.8rem; color: #666; margin-bottom: 2.5rem; }
.back { font-size: 0.85rem; margin-bottom: 1.5rem; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.25rem;
}
.card {
  background: #1e1e1e;
  border: 1px solid #2e2e2e;
  border-radius: 8px;
  overflow: hidden;
  display: block;
  transition: border-color 0.15s;
}
.card:hover { border-color: #c8a96e; }
.card img { width: 100%; height: auto; display: block; background: #fff; }
.card-body { padding: 0.75rem 1rem; }
.card-title { font-size: 1rem; color: #eee; font-weight: 600; }
</style>
</head>
<body>
  <h1>Woodworking Projects</h1>
  <p class="meta">Generated 2026-05-03 09:39 UTC &mdash; 2 project(s)</p>
  <div class="grid">
    <a class="card" href="firewood-shelter/">
      <img src="firewood-shelter/preview.png" alt="Firewood Shelter">
      <div class="card-body">
        <div class="card-title">Firewood Shelter</div>
      </div>
    </a>
    <a class="card" href="garage-workbench/">
      <img src="garage-workbench/preview.png" alt="Garage Workbench">
      <div class="card-body">
        <div class="card-title">Garage Workbench</div>
      </div>
    </a>
  </div>
</body>
</html>
