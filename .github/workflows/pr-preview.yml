name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write      # push to gh-pages branch
  pull-requests: write # post/update PR comment

jobs:
  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get install -y libcairo2 libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render previews for all projects
        run: |
          for dir in projects/*/; do
            slug="${dir%/}"; slug="${slug#projects/}"
            echo "=== $slug ==="
            bash preview-all.sh "$slug" || echo "WARNING: render failed for $slug"
          done

      - name: Generate HTML gallery
        run: python generate-index.py

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          cp gallery.html _deploy/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true  # preserve other PRs' preview directories

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const pr    = context.payload.pull_request.number;
            const sha   = context.payload.pull_request.head.sha.slice(0, 7);
            const url   = `https://${owner}.github.io/${repo}/pr-${pr}/`;
            const marker = '<!-- woodworking-preview-bot -->';
            const body = [
              marker,
              '## Woodworking Previews',
              '',
              `| | |`,
              `|---|---|`,
              `| **URL** | [${url}](${url}) |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Updated** | ${new Date().toUTCString()} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr, body,
              });
            }

  # ── Cleanup ─────────────────────────────────────────────────────────────────
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Remove PR preview from gh-pages
        run: |
          PR="${{ github.event.pull_request.number }}"
          git fetch origin gh-pages 2>/dev/null || {
            echo "gh-pages branch does not exist — nothing to clean up."
            exit 0
          }
          git checkout gh-pages
          if [ ! -d "pr-${PR}" ]; then
            echo "Preview directory pr-${PR} not found — nothing to clean up."
            exit 0
          fi
          rm -rf "pr-${PR}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove preview for PR #${PR}"
          git push origin gh-pages
