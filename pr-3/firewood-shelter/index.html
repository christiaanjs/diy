<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firewood Shelter — Woodworking</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, sans-serif;
  background: #111;
  color: #ddd;
  padding: 2rem 1.5rem;
  max-width: 1200px;
  margin: 0 auto;
}
a { color: #c8a96e; text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.6rem; margin-bottom: 0.25rem; color: #fff; }
h2 { font-size: 1.3rem; color: #c8a96e; margin-bottom: 1rem; }
.meta { font-size: 0.8rem; color: #666; margin-bottom: 2.5rem; }
.back { font-size: 0.85rem; margin-bottom: 1.5rem; }

.views {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}
figure {
  background: #1e1e1e;
  border: 1px solid #2e2e2e;
  border-radius: 6px;
  overflow: hidden;
}
figcaption {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #888;
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid #252525;
}
figure img { width: 100%; height: auto; display: block; background: #fff; }
</style>
</head>
<body>
  <p class="back"><a href="../">← All Projects</a></p>
  <h2>Firewood Shelter</h2>
  <p class="meta">Generated 2026-05-01 09:01 UTC</p>
  <div class="views">
    <figure>
      <figcaption>Isometric</figcaption>
      <img src="preview.png" alt="Isometric">
    </figure>
    <figure>
      <figcaption>Front</figcaption>
      <img src="preview-front.png" alt="Front">
    </figure>
    <figure>
      <figcaption>Back</figcaption>
      <img src="preview-back.png" alt="Back">
    </figure>
    <figure>
      <figcaption>Side (right)</figcaption>
      <img src="preview-side.png" alt="Side (right)">
    </figure>
    <figure>
      <figcaption>Left</figcaption>
      <img src="preview-left.png" alt="Left">
    </figure>
    <figure>
      <figcaption>Top</figcaption>
      <img src="preview-top.png" alt="Top">
    </figure>
  </div>
</body>
</html>
